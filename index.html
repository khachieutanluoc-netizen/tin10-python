const CL=['10A1','10A2','10A3','10A4','10B1','10B2','10C1','10C2','10C3','10D1'];
function login(){app.innerHTML=`<h1>Tin học 10 – Chủ đề F</h1><p class=m>Lập trình Python · tự học theo trình tự, lưu tiến độ</p>
<div class=card><h2>Đăng nhập học tập</h2><p class=m>Gõ đúng họ và tên IN HOA, có dấu tiếng Việt (ví dụ: NGUYỄN VĂN AN). Lần sau nhập đúng như lần đầu để học tiếp.</p>
<input type=text id=nm placeholder="HỌ VÀ TÊN"><p><select id=cl>${CL.map(c=>`<option>${c}</option>`).join('')}</select></p><p id=er class=no></p><button id=go>Bắt đầu học</button> <button class=g id=gv>Giáo viên theo dõi</button></div>`;
$('#nm').oninput=e=>{e.target.value=e.target.value.toLocaleUpperCase('vi')};
$('#go').onclick=()=>{const n=$('#nm').value.replace(/\s+/g,' ').trim();
 if(n.split(' ').length<2||/\d/.test(n)||n!==n.toLocaleUpperCase('vi'))return $('#er').textContent='Vui lòng nhập đầy đủ họ và tên (ít nhất 2 từ, có dấu tiếng Việt, không có số).';
 if(!/^[\p{L} ]+$/u.test(n))return $('#er').textContent='Họ tên chỉ gồm chữ cái.';
 const c=$('#cl').value;K='tin10F:'+c+':'+n;let d=null;try{d=JSON.parse(localStorage.getItem(K))}catch(e){}
 S=d||{name:n,cls:c,L:{}};save();home()};
$('#gv').onclick=teacher}
// ===== Trang chủ =====
function home(){const tot=Math.round(L.reduce((a,l)=>a+pct(l.id),0)/L.length);
app.innerHTML=`<h1>${esc(S.name)} – ${S.cls}</h1><div class=bar><i style="width:${tot}%"></i></div><p class=m>Tiến độ toàn khóa: ${tot}% · Qua bài khi đúng từ 80% câu hỏi</p>
<div class=card>${L.map((l,i)=>{const s=st(l.id),u=unlocked(i);return `<div class=ls><div><b>Bài ${l.id}: ${l.n}</b><div class=m>${u?(s.done?'✔ Đạt – cao nhất '+s.best+'%':'Đang học'):'🔒 Hoàn thành bài trước (≥80%) để mở'} · ${pct(l.id)}%</div></div><button ${u?'':'disabled'} data-i=${i}>${s.done?'Học lại':s.step||s.best?'Tiếp tục':'Học'}</button></div>`}).join('')}
<div class=ls><div><b>Bài kiểm tra cuối khóa</b><div class=m>${allDone()?'40 câu · 45 phút · làm nhiều lần'+(S.fin?` · cao nhất ${S.fin.best}%`:''):'🔒 Hoàn thành Bài 26'}</div></div><button id=fx ${allDone()?'':'disabled'}>Làm bài</button></div></div><button class=g id=out>Đăng xuất</button>`;
document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>lesson(+b.dataset.i));$('#fx').onclick=final;$('#out').onclick=()=>{S=null;login()}}
// ===== Hiển thị & chấm câu hỏi =====
function qHTML(q,n){let h=`<div class=q data-n=${n}><b>${n+1}. ${esc(q.q.replace('{0}','＿＿'))}</b>`;
 if(q.t=='o')h+=q.o.map((o,i)=>`<label><input type=radio name=r${n} value=${i}> ${'ABCD'[i]}. ${esc(o)}</label>`).join('');
 if(q.t=='m')h+='<div class=m>Chọn tất cả đáp án đúng</div>'+q.o.map((o,i)=>`<label><input type=checkbox name=r${n} value=${i}> ${esc(o)}</label>`).join('');
 if(q.t=='f')h+=q.s.map((s,j)=>`<p><select name=r${n}_${j}><option value="">-- chọn --</option>${s[0].map((o,i)=>`<option value=${i}>${esc(o)}</option>`).join('')}</select></p>`).join('');
 if(q.t=='t')h+=q.s.map((s,j)=>`<div class=row><span style="flex:1">${'abcd'[j]}) ${esc(s[0])}</span><select name=r${n}_${j}><option value="">?</option><option value=1>Đúng</option><option value=0>Sai</option></select></div>`).join('');
 return h+`<div class=fb></div></div>`}
function grade(q,n,root){const v=k=>{const e=root.querySelector(`[name=${k}]`);return e&&e.value};let ok=false;
 if(q.t=='o'){const c=root.querySelector(`[name=r${n}]:checked`);ok=c&&+c.value===q.a}
 if(q.t=='m'){const c=[...root.querySelectorAll(`[name=r${n}]:checked`)].map(e=>+e.value).sort().join();ok=c===[...q.a].sort().join()}
 if(q.t=='f')ok=q.s.every((s,j)=>v(`r${n}_${j}`)!==''&&+v(`r${n}_${j}`)===s[1]);
 if(q.t=='t')ok=q.s.every((s,j)=>v(`r${n}_${j}`)!==''&&+v(`r${n}_${j}`)===s[1]);
 return !!ok}
// ===== Mô phỏng trực quan =====
function frames(t,N){const f=[];
 if(t=='if'){f.push({h:0,v:`n = ${N}`});const e=N%2==0;f.push({h:1,v:`n % 2 == 0 → ${e?'True':'False'}`});f.push({h:e?2:4,v:'Rẽ nhánh '+(e?'if':'else'),o:e?'Chẵn':'Lẻ'});return{L:['n = '+N,'if n % 2 == 0:','    print("Chẵn")','else:','    print("Lẻ")'],f}}
 if(t=='for'){let s=0;f.push({h:0,v:'s = 0',c:-1});for(let i=1;i<=N;i++){f.push({h:1,v:`i = ${i}  (vòng ${i})`,c:i-1,s});s+=i;f.push({h:2,v:`i = ${i}, s = ${s}`,c:i-1})}f.push({h:3,v:`s = ${s}`,o:String(s),c:-1});return{L:['s = 0',`for i in range(1, ${N+1}):`,'    s = s + i','print(s)'],f}}
 let i=1,s=0;f.push({h:0,v:'i = 1',c:0});f.push({h:1,v:'s = 0',c:0});for(;i<=N;){f.push({h:2,v:`i <= ${N} → True (i=${i})`,c:i-1});s+=i;f.push({h:3,v:`s = ${s}`,c:i-1});i++;f.push({h:4,v:`i = ${i}`,c:i-1})}
 f.push({h:2,v:`i <= ${N} → False (i=${i}) → thoát vòng lặp`,c:-1});f.push({h:5,v:`s = ${s}`,o:String(s),c:-1});return{L:['i = 1','s = 0',`while i <= ${N}:`,'    s = s + i','    i = i + 1','print(s)'],f}}
function sim(t,host){let k=0,N=t=='if'?7:5,D;
 host.innerHTML=`<div class=sim><b>▶ Mô phỏng ${t=='if'?'rẽ nhánh if':t=='for'?'vòng lặp for':'vòng lặp while'}</b><p>${t=='if'?'Nhập n':'Nhập N (1–10)'}: <input type=number id=sn value=${N} style="width:80px"> <button id=nx>Bước tiếp</button> <button class=g id=rs>Làm lại</button></p><pre id=sc></pre><div id=sv></div><div class=m>Biến:</div><div id=sw class=out style="color:#fde68a"></div><div class=m>Kết quả chương trình:</div><div class=out id=so></div></div>`;
 const draw=()=>{D=frames(t,N);const fr=D.f[Math.min(k,D.f.length)-1];
  $('#sc').innerHTML=D.L.map((l,i)=>`<span class="${fr&&fr.h==i?'h':''}" style="display:block">${esc(l)||' '}</span>`).join('');
  $('#sw').textContent=fr?fr.v:'(chưa chạy)';$('#so').textContent=fr&&fr.o?fr.o:(k>=D.f.length&&D.f[D.f.length-1].o)||'';
  $('#sv').innerHTML=t=='if'?'':'<div class=m>Danh sách giá trị của biến đếm i (duyệt lần lượt):</div>'+Array.from({length:N},(_,i)=>`<span class="cell ${fr&&fr.c===i?'on':''}">${i+1}</span>`).join('');
  $('#nx').disabled=k>=D.f.length};
 $('#nx').onclick=()=>{if(k<D.f.length)k++;draw()};$('#rs').onclick=()=>{k=0;draw()};
 $('#sn').onchange=e=>{N=Math.max(1,Math.min(t=='if'?999:10,+e.target.value||1));k=0;draw()};draw()}
// ===== Bài học =====
function lesson(i){const l=L[i],s=st(l.id);if(s.step<l.x.length)return step(i);quiz(i)}
function step(i){const l=L[i],s=st(l.id),x=l.x[s.step];
 app.innerHTML=`<button class=g id=bk>← Danh sách bài</button><h2>Bài ${l.id}: ${l.n}</h2><div class=bar><i style="width:${pct(l.id)}%"></i></div><p class=m>Nội dung ${s.step+1}/${l.x.length} · Tiến độ bài: ${pct(l.id)}%</p>
<div class=card><h2>${x.h}</h2><p>${x.p}</p><pre>${esc(x.c)}</pre><div id=sm></div></div><div class=card><b>Kiểm tra nhanh – trả lời đúng để học tiếp</b>${qHTML(x.q,0)}<button id=ck>Kiểm tra</button> <button id=nt style="display:none">${s.step+1<l.x.length?'Nội dung tiếp theo':'Làm bài trắc nghiệm'}</button></div>`;
 $('#bk').onclick=home;if(l.sim&&s.step==0)sim(l.sim,$('#sm'));
 $('#ck').onclick=()=>{const ok=grade(x.q,0,app),f=app.querySelector('.fb');f.innerHTML=ok?'<span class=ok>✔ Chính xác!</span>':'<span class=no>✘ Chưa đúng, hãy đọc lại nội dung và thử lại.</span>';if(ok){$('#nt').style.display='';$('#ck').disabled=true}};
 $('#nt').onclick=()=>{s.step++;save();lesson(i)}}
// ===== Trắc nghiệm cuối bài =====
function quiz(i,list,title,sec,done){const l=L[i],qs=list||sh(l.q);
 app.innerHTML=`<button class=g id=bk>← Danh sách bài</button><h2>${title||`Trắc nghiệm Bài ${l.id}`}</h2><p class=m id=tm>${sec?'':'Cần đúng ≥ 80% để sang bài tiếp theo.'}</p><div class=card>${qs.map(qHTML).join('')}<button id=sb>Nộp bài</button></div>`;
 $('#bk').onclick=()=>{clearInterval(window.tid);home()};
 const submit=()=>{clearInterval(window.tid);const bad={};let c=0;qs.forEach((q,n)=>{const r=app.querySelector(`[data-n="${n}"]`),ok=grade(q,n,r);if(ok)c++;else bad[q.g]=1;r.querySelector('.fb').innerHTML=ok?'<span class=ok>✔ Đúng</span>':'<span class=no>✘ Sai</span>'});
  const p=Math.round(c/qs.length*100);$('#sb').disabled=true;done(p,Object.keys(bad),c,qs.length)};
 $('#sb').onclick=submit;return submit}
function result(p,bad,c,n,pass,again){const box=document.createElement('div');box.className='card';
 box.innerHTML=`<h2>Kết quả: ${c}/${n} câu đúng – ${p}%</h2><p class=${p>=pass?'ok':'no'}>${p>=pass?'✔ Đạt yêu cầu':'✘ Chưa đạt, cần ≥ '+pass+'%'}</p><p><b>Nhận xét:</b> ${bad.length?'kiến thức còn hạn chế ở: <b>'+bad.map(esc).join(', ')+'</b>. Hãy ôn lại phần này.':'em nắm vững toàn bộ kiến thức của bài. Rất tốt!'}</p><button id=hm>Về danh sách bài</button> <button class=g id=ag>Làm lại</button>`;
 app.appendChild(box);box.scrollIntoView({behavior:'smooth'});$('#hm').onclick=home;$('#ag').onclick=again}
quiz.l=0;
const _q=quiz;quiz=function(i){const l=L[i],s=st(l.id);_q(i,null,null,0,(p,bad,c,n)=>{s.best=Math.max(s.best,p);s.fb=bad;if(p>=80)s.done=true;save();result(p,bad,c,n,80,()=>quiz(i))})};
// ===== Kiểm tra cuối khóa =====
function final(){const pool=sh(L.flatMap(l=>l.q)),qs=[];while(qs.length<40)qs.push(...pool.slice(0,40-qs.length));let left=45*60;
 const sub=_q(0,qs,'Bài kiểm tra cuối khóa',1,(p,bad,c,n)=>{S.fin=S.fin||{best:0};S.fin.best=Math.max(S.fin.best,p);S.fin.last=p;save();result(p,bad,c,n,50,final)});
 window.tid=setInterval(()=>{left--;$('#tm').textContent='⏱ Còn lại '+String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');if(left<=0){sub()}},1000)}
// ===== Giáo viên theo dõi =====
function teacher(){app.innerHTML=`<button class=g id=bk>← Quay lại</button><h2>Giáo viên theo dõi tiến độ</h2><div class=card id=tb>Đang tải…</div>`;$('#bk').onclick=login;
 const show=rows=>{rows.sort((a,b)=>a.cls.localeCompare(b.cls)||a.name.localeCompare(b.name,'vi'));$('#tb').innerHTML=rows.length?`<div style="overflow-x:auto"><table><tr><th>Lớp</th><th>Họ tên</th>${L.map(l=>`<th>B${l.id}</th>`).join('')}<th>Cuối khóa</th></tr>${rows.map(r=>`<tr><td>${r.cls}</td><td>${esc(r.name)}</td>${L.map(l=>{const s=(r.L||{})[l.id];return `<td>${s?(s.done?'✔ ':'')+s.best+'%':'–'}</td>`}).join('')}<td>${r.fin?r.fin.best+'%':'–'}</td></tr>`).join('')}</table></div>`:'Chưa có dữ liệu.'};
 if(db)db.collection('hs').get().then(s=>show(s.docs.map(d=>d.data()))).catch(()=>local());else local();
 function local(){const r=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('tin10F:'))r.push(JSON.parse(localStorage.getItem(k)))}}catch(e){}show(r);$('#tb').insertAdjacentHTML('beforeend','<p class=m>Đang hiển thị dữ liệu lưu trên thiết bị này.</p>')}}
login();
try{if(window.claude)claude.use('db').then(d=>{db=d}).catch(()=>{})}catch(e){}
</script></body></html>
